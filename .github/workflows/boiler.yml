name: Boiler monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # UTC; мінімум для GitHub — 5 хв
  workflow_dispatch:        # ручний запуск для тесту

concurrency:
  group: boiler
  cancel-in-progress: false

permissions:
  contents: write   # щоб workflow міг закомітити state.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # завжди актуальний state.json, а не SHA на момент постановки в чергу

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python boiler_check.py
        env:
          DEYE_APP_ID: ${{ secrets.DEYE_APP_ID }}
          DEYE_APP_SECRET: ${{ secrets.DEYE_APP_SECRET }}
          DEYE_EMAIL: ${{ secrets.DEYE_EMAIL }}
          DEYE_PASSWORD: ${{ secrets.DEYE_PASSWORD }}
          DEYE_DEVICE_SN: ${{ secrets.DEYE_DEVICE_SN }}
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          VOLTAGE_THRESHOLD: "100"
          GRID_POWER_MAX_KW: "2.5"
          CHARGE_A_NORMAL: "80"
          CHARGE_A_ECO: "40"
          SOC_BOILER_OK: "90"
          DEYE_READ_TIMEOUT_S: "60"

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "boiler-bot"
            git config user.email "boiler-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(cat state.json)"
            git pull --rebase
            git push
          fi
